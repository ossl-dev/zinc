name: Release
on:
  push:
    tags: ['v*']

jobs:
  build-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo run -p zinc-core --example generate_header --features generate-header --locked -- --check
      - run: cargo build --release --manifest-path core/Cargo.toml --locked
      - name: Upload core library
        uses: actions/upload-artifact@v4
        with:
          name: libzinc_core-${{ runner.os }}
          path: |
            target/release/libzinc_core.so
            target/release/libzinc_core.dylib
          if-no-files-found: error

  release-github:
    needs: [build-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libzinc_core-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            adapters/cpp/include/zinc.hpp
            include/zinc.h
            libzinc_core.so
            libzinc_core.dylib
          generate_release_notes: true
