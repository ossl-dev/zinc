name: CI
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    paths:
      - 'core/**'
      - 'adapters/**'
      - 'include/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - 'deny.toml'

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run -p zinc-core --example generate_header --features generate-header --locked -- --check

  cargo-deny:
    strategy:
      matrix:
        manifest: [Cargo.toml, adapters/node/Cargo.toml]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check -p zinc-core --lib --locked

  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: sudo apt-get update -y && sudo apt-get install -y valgrind
      - name: Build test executable
        run: cargo test -p zinc-core --lib --no-run --locked --message-format=json > test-artifacts.json
      - name: Run tests under valgrind
        shell: bash
        run: |
          test_binary=$(python3 -c 'import json; print(next(a["executable"] for a in map(json.loads, open("test-artifacts.json")) if a.get("reason") == "compiler-artifact" and a.get("executable") and a["profile"]["test"]))')
          valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 "$test_binary" --test-threads=1

  adapters:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo build --release -p zinc-core --lib --example interop --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'adapters/python[test]'
      - run: python -m pytest adapters/python/tests -v
      - run: python -m mypy --strict adapters/python/tests/typing_check.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./... && go test -race -v ./...
        working-directory: adapters/go
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt -- --check && cargo clippy --locked -- -D warnings
        working-directory: adapters/node
      - run: npm ci && npm run build && npm test
        working-directory: adapters/node
      - uses: oven-sh/setup-bun@v2
      - run: bun test adapters/bun/tests
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --unstable-ffi --allow-ffi --allow-read --config adapters/deno/deno.json adapters/deno/tests/zinc_test.ts
      - run: cmake -S adapters/cpp -B target/cpp-tests && cmake --build target/cpp-tests && ctest --test-dir target/cpp-tests --output-on-failure
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn --batch-mode test
        working-directory: adapters/java
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test adapters/csharp/tests/Zinc.Tests.csproj
