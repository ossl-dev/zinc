[package]
name = "zinc-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
thiserror = "2"
libc = "0.2"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
static_assertions = "1"
prost = "0.14"
redis = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false
