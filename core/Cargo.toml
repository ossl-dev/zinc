[package]
name = "zinc-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
generate-header = ["dep:cbindgen"]

[dependencies]
thiserror = "2"
libc = "0.2"

cbindgen = { version = "0.28", optional = true }

[dev-dependencies]
prost = "0.14"
redis = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "ring"
harness = false

[[example]]
name = "generate_header"
required-features = ["generate-header"]
