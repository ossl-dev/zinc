tasks:
  build:
    command: cargo build --release --lib --locked
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/rust-toolchain.toml"
    outputs:
      - "/target/release/libzinc_core.*"

  interop:
    command: cargo build --release --example interop --locked
    deps:
      - build
    inputs:
      - "examples/interop.rs"
    outputs:
      - "/target/release/examples/interop"

  test:
    command: cargo test --all-targets --locked
    deps:
      - build

  lint:
    command: cargo clippy --all-targets --all-features --locked -- -D warnings
    deps:
      - build

  header:
    command: cargo run --locked --example generate_header --features generate-header
    inputs:
      - "src/**/*.rs"
      - "examples/generate_header.rs"
      - "cbindgen.toml"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/rust-toolchain.toml"
    outputs:
      - "/include/zinc.h"

  check-header:
    command: cargo run --locked --example generate_header --features generate-header -- --check
    inputs:
      - "src/**/*.rs"
      - "examples/generate_header.rs"
      - "cbindgen.toml"
      - "Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/rust-toolchain.toml"
      - "/include/zinc.h"
