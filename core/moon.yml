tasks:
  build:
    command: cargo build --release
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "cbindgen.toml"
    outputs:
      - "../target/release/libzinc_core.*"

  test:
    command: cargo test --all-targets --locked
    deps:
      - build

  lint:
    command: cargo clippy --all-targets --locked -- -D warnings
    deps:
      - build

  header:
    command: cargo run --locked --example generate_header --features generate-header
    inputs:
      - "src/**/*.rs"
      - "examples/generate_header.rs"
      - "cbindgen.toml"
      - "Cargo.toml"
    outputs:
      - "../include/zinc.h"

  check-header:
    command: cargo run --locked --example generate_header --features generate-header -- --check
    inputs:
      - "src/**/*.rs"
      - "examples/generate_header.rs"
      - "cbindgen.toml"
      - "Cargo.toml"
      - "../include/zinc.h"
