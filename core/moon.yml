tasks:
  build:
    command: cargo build --release
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "build.rs"
      - "cbindgen.toml"
    outputs:
      - "../target/release/libzinc_core.*"
      - "../include/zinc.h"

  test:
    command: cargo test --all-targets --locked
    deps:
      - build

  lint:
    command: cargo clippy --all-targets --locked -- -D warnings
    deps:
      - build
