[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0"]
confidence-threshold = 0.8
exceptions = [{ name = "cbindgen", allow = ["MPL-2.0"] }]

[advisories]
unmaintained = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
