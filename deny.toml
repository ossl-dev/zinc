[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0"]
confidence-threshold = 0.8
copyleft = "deny"

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
